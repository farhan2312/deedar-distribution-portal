document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3;   /* secondary */\n  --ink-3: #86868B;   /* tertiary / captions */\n  --on-accent: #FFFFFF;\n\n  /* ---------- ELEVATION (soft, diffuse — Apple) ---------- */\n  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);\n  --shadow-md: 0 4px 20px rgba(0,0,0,0.07);\n  --shadow-lg: 0 14px 50px rgba(0,0,0,0.10);\n  --shadow-violet: 0 10px 34px -12px rgba(145,12,179,0.45);\n\n  /* ---------- SEMANTIC ---------- */\n  --success: #1E9E5A;\n  --warning: #B25E00;\n  --danger:  #C7263B;\n  --info:    #7C0FA8;\n\n  /* ============================================================\n     TYPOGRAPHY — Apple system stack (SF Pro on Apple devices)\n     ============================================================ */\n  --font-display: -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Helvetica Neue\", \"Manrope\", system-ui, sans-serif;\n  --font-sans:    -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", \"Manrope\", system-ui, sans-serif;\n  --font-mono:    ui-monospace, \"SF Mono\", \"SFMono-Regular\", \"Menlo\", monospace;\n\n  /* scale (px) — large, airy */\n  --text-display: 80px;   /* hero */\n  --text-h1: 56px;\n  --text-h2: 44px;\n  --text-h3: 28px;\n  --text-h4: 22px;\n  --text-h5: 19px;\n  --text-body-lg: 21px;\n  --text-body: 17px;\n  --text-sm: 15px;\n  --text-caption: 13px;\n  --text-eyebrow: 17px;\n\n  --leading-tight: 1.06;\n  --leading-snug: 1.14;\n  --leading-normal: 1.47;     /* Apple body */\n  --leading-relaxed: 1.6;\n\n  --tracking-tight: -0.015em;\n  --tracking-tighter: -0.025em;\n  --tracking-normal: 0em;\n  --weight-reg: 400;\n  --weight-med: 500;\n  --weight-semi: 600;\n  --weight-bold: 700;\n\n  /* ---------- RADII (generous, Apple) ---------- */\n  --r-xs: 8px;\n  --r-sm: 12px;\n  --r-md: 18px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n  --r-pill: 980px;\n\n  /* ---------- SPACING (8pt base) ---------- */\n  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;\n  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;\n  --s-9: 96px; --s-10: 128px;\n}\n\n/* ============================================================\n   SEMANTIC TYPE CLASSES (light)\n   ============================================================ */\n.t-display { font-family: var(--font-display); font-weight: 700; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tighter); color: var(--ink-1); }\n.t-h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--text-h1); line-height: var(--leading-tight); letter-spacing: var(--tracking-tighter); color: var(--ink-1); }\n.t-h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-h2); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); color: var(--ink-1); }\n.t-h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-h3); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); color: var(--ink-1); }\n.t-h4 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-h4); line-height: var(--leading-snug); color: var(--ink-1); }\n.t-body-lg { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-body-lg); line-height: var(--leading-relaxed); color: var(--ink-2); }\n.t-body { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-body); line-height: var(--leading-normal); color: var(--ink-2); }\n.t-sm { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--ink-2); }\n.t-caption { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-caption); line-height: var(--leading-normal); color: var(--ink-3); }\n.t-eyebrow { font-family: var(--font-sans); font-weight: 600; font-size: var(--text-eyebrow); letter-spacing: 0; color: var(--accent); }\n.t-mono { font-family: var(--font-mono); font-size: var(--text-sm); letter-spacing: 0; color: var(--ink-2); }\n\n/* gradient text helper (use sparingly) */\n.t-gradient { background: var(--gradient-cosmic); -webkit-background-clip: text; background-clip: text; color: transparent; }\n<\u002Fstyle>\n  <style>/* Shared base for Design System preview cards (light / Apple).\n   NOTE: each card HTML inlines the tokens — these are render bases only. */\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { width: 100%; }\nbody {\n  font-family: var(--font-sans);\n  color: var(--ink-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n.card { padding: 26px 30px; }\n.row { display: flex; gap: 14px; align-items: center; }\n.col { display: flex; flex-direction: column; }\n.eyebrow { font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: var(--accent); }\n.mut { color: var(--ink-3); }\n.mono-sm { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   COSMOS — Website UI Kit styles · Light / Apple-style\n   Clean white canvas, airy spacing, brand violet accent.\n   ============================================================ */\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--font-sans);\n  color: var(--ink-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\nimg { display: block; max-width: 100%; }\nbutton { font-family: inherit; cursor: pointer; }\na { color: inherit; text-decoration: none; }\n::selection { background: rgba(145,12,179,.16); }\n\n.wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }\n.wrap-narrow { max-width: 760px; margin: 0 auto; padding: 0 28px; }\n.section { padding: 110px 0; position: relative; }\n.section.soft { background: var(--bg-soft); }\n.section.tint { background: linear-gradient(180deg, #FBF8FE, #F4EAFB); }\n\n/* ---- type helpers ---- */\n.eyebrow { font-weight: 600; font-size: 17px; letter-spacing: 0; color: var(--accent); }\n.h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; letter-spacing: -.02em; color: var(--ink-1); }\n.lede { font-size: 21px; line-height: 1.5; color: var(--ink-2); max-width: 640px; font-weight: 400; }\n.gradient-text { background: var(--gradient-cosmic); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.accent-text { color: var(--accent); }\n\n/* ---- buttons (Apple pill) ---- */\n.btn { font-weight: 600; font-size: 17px; border: none; border-radius: 980px; padding: 12px 24px; display: inline-flex; align-items: center; gap: 7px; transition: background .2s, transform .1s, box-shadow .2s; white-space: nowrap; }\n.btn:active { transform: scale(.97); }\n.btn-primary { background: var(--accent); color: #fff; }\n.btn-primary:hover { background: var(--accent-hover); }\n.btn-secondary { background: var(--bg-soft); color: var(--ink-1); border: 1px solid var(--hairline); }\n.btn-secondary:hover { background: #ECECEF; }\n.btn-sm { font-size: 15px; padding: 9px 18px; }\n.link { font-weight: 600; font-size: 17px; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; transition: gap .2s; }\n.link:hover { gap: 8px; }\n\n/* ---- NAV (Apple translucent) ---- */\n.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }\n.nav.scrolled { background: rgba(255,255,255,.8); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hairline-soft); }\n.nav-inner { display: flex; align-items: center; gap: 26px; height: 56px; }\n.nav-brand { display: flex; align-items: center; gap: 9px; }\n.nav-brand img { height: 26px; }\n.nav-brand b { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; color: var(--ink-1); }\n.nav-links { display: flex; gap: 30px; margin-left: auto; }\n.nav-links a { font-size: 1 ge=\"{{ setForgotConfirmPwd }}\"><\u002Fdiv>\n      <sc-if value=\"{{ forgotError }}\"><p style=\"color:var(--danger);font-size:12px;margin:8px 0 0\">{{ forgotError }}<\u002Fp><\u002Fsc-if>\n      <button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;padding:14px;margin-top:16px\" sc-camel-on-click=\"{{ submitForgotReset }}\">Set password &amp; log in<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isChangePwd }}\">\n  <div data-screen-label=\"Set Password\" style=\"max-width:400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px;animation:fadeUp .3s ease\">\n    <div style=\"text-align:center;margin-bottom:24px\">\n      <h1 style=\"font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 8px\">Set a new password<\u002Fh1>\n      <p style=\"font-size:13px;color:var(--ink-2);margin:0\">First login for {{ pendingUserName }} — replace your mobile number with a password only you know.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:28px;box-shadow:var(--shadow-md)\">\n      <div class=\"field\" style=\"margin-bottom:14px\"><label>New password<\u002Flabel><input class=\"inp\" type=\"password\" value=\"{{ newPassword }}\" sc-camel-on-change=\"{{ setNewPassword }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"margin-bottom:6px\"><label>Confirm password<\u002Flabel><input class=\"inp\" type=\"password\" value=\"{{ confirmPassword }}\" sc-camel-on-change=\"{{ setConfirmPassword }}\"><\u002Fdiv>\n      <sc-if value=\"{{ pwdError }}\"><p style=\"color:var(--danger);font-size:12px;margin:8px 0 0\">{{ pwdError }}<\u002Fp><\u002Fsc-if>\n      <button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;padding:14px;margin-top:16px\" sc-camel-on-click=\"{{ doSetPassword }}\">Set password &amp; continue<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRetailerScreen }}\">\n  <div data-screen-label=\"Retailer Scheme Claim\" style=\"max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--hairline-soft)\">\n      <button class=\"btn btn-secondary\" style=\"width:36px;height:36px;padding:0;justify-content:center;border-radius:50%\" sc-camel-on-click=\"{{ leaveRetailer }}\" aria-label=\"Back\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 19-7-7 7-7\"><\u002Fpath><path d=\"M19 12H5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <div style=\"font-weight:600;font-family:var(--font-display);font-size:15px\">Deedar Scheme Scan<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center\">\n      <sc-if value=\"{{ isRetailerIdle }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"animation:fadeUp .3s ease\">\n          <div style=\"width:88px;height:88px;border-radius:50%;background:var(--gradient-cosmic);display:flex;align-items:center;justify-content:center;margin:0 auto 20px\">\n            <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"5\" height=\"5\" x=\"3\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"5\" height=\"5\" x=\"16\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"5\" height=\"5\" x=\"3\" y=\"16\" rx=\"1\"><\u002Frect><path d=\"M21 16h-3a2 2 0 0 0-2 2v3\"><\u002Fpath><path d=\"M21 21v.01\"><\u002Fpath><path d=\"M12 7v3a2 2 0 0 1-2 2H7\"><\u002Fpath><path d=\"M3 12h.01\"><\u002Fpath><path d=\"M12 3h.01\"><\u002Fpath><path d=\"M12 16v.01\"><\u002Fpath><path d=\"M16 12h1\"><\u002Fpath><path d=\"M21 12v.01\"><\u002Fpath><path d=\"M12 21v-1\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h2 style=\"font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 8px\">Scan the QR on your pack<\u002Fh2>\n          <p style=\"color:var(--ink-2);font-size:14px;margin:0 0 28px\">Every scratch code redeems straight to your UPI — no salesman needed.<\u002Fp>\n          <button class=\"btn btn-primary\" style=\"padding:14px 28px\" sc-camel-on-click=\"{{ startScan }}\">Scan code<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isRetailerScanning }}\">\n        <div style=\"animation:fadeUp .2s ease\">\n          <div style=\"width:56px;height:56px;border:3px solid var(--accent);border-top-color:transparent;border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite\"><\u002Fdiv>\n          <p style=\"font-size:14px;color:var(--ink-2)\">Reading code…<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isRetailerClaim }}\">\n        <div style=\"animation:fadeUp .3s ease;width:100%\">\n          <div class=\"card\" style=\"padding:20px;margin-bottom:20px;box-shadow:var(--shadow-md)\">\n            <div class=\"eyebrow\" style=\"font-size:11px;margin-bottom:6px\">Code recognised<\u002Fdiv>\n            <div style=\"font-family:var(--font-display);font-weight:600;font-size:19px\">{{ scanCode }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--ink-2);margin-top:4px\">Scheme value ₹{{ scanValue }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:18px;text-align:left\">\n            <label>Your UPI-linked mobile<\u002Flabel>\n            <input class=\"inp\" type=\"tel\" value=\"{{ retailerMobile }}\" sc-camel-on-change=\"{{ setRetailerMobile }}\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;padding:14px\" sc-camel-on-click=\"{{ confirmClaim }}\">Claim ₹{{ scanValue }} to my UPI<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isRetailerSuccess }}\">\n        <div style=\"animation:fadeUp .3s ease\">\n          <div style=\"width:72px;height:72px;border-radius:50%;background:rgba(30,158,90,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--success)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h2 style=\"font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 8px\">₹{{ scanValue }} credited<\u002Fh2>\n          <p style=\"color:var(--ink-2);font-size:14px;margin:0 0 28px\">Sent to {{ retailerMobile }} via UPI in seconds. No cash, no waiting on a salesman.<\u002Fp>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ scanAnother }}\">Scan another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPortal }}\">\n  <sc-if value=\"{{ viewAsActive }}\">\n    <div style=\"position:fixed;top:0;left:0;right:0;z-index:400;background:var(--ink-1);color:#fff;padding:9px 20px;display:flex;align-items:center;gap:10px;font-size:13px\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n      <span>Viewing as <strong>{{ sessionName }}<\u002Fstrong><\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button class=\"link\" style=\"color:#fff;font-size:13px;text-decoration:underline\" sc-camel-on-click=\"{{ exitViewAs }}\">Exit to Admin view<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div data-screen-label=\"Deedar Drive Portal\" style=\"display:flex;min-height:100vh;position:relative;{{ viewAsBannerPad }}\">\n    <div style=\"width:250px;flex:none;background:#0A0A0A;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto\">\n      <div style=\"padding:0 20px 16px\"><div style=\"font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff\">Deedar Drive<\u002Fdiv><div style=\"font-size:11px;color:rgba(241,247,242,.55);margin-top:2px\">Distribution Portal<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ navSections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n        <div style=\"padding:14px 20px 6px;display:flex;align-items:center;gap:6px\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:{{ sec.dot }}\"><\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:{{ sec.dot }}\">{{ sec.title }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n          <button style=\"text-align:left;border:none;cursor:pointer;margin:1px 12px;padding:9px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:600;background:{{ it.bg }};color:{{ it.color }}\" sc-camel-on-click=\"{{ it.onSelect }}\">{{ it.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-for>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <sc-if value=\"{{ canAdmin }}\">\n        <div style=\"padding:0 20px 12px\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(241,247,242,.45);margin-bottom:6px\">View platform as<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ viewAsRoleOptions }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <button style=\"border:1px solid rgba(255,255,255,.18);background:none;color:rgba(241,247,242,.75);font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill);cursor:pointer\" sc-camel-on-click=\"{{ r.onSelect }}\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:12px\">\n        <div style=\"font-size:12px;color:rgba(241,247,242,.7);margin-bottom:8px\">{{ sessionName }}<\u002Fdiv>\n        <button class=\"link\" style=\"font-size:13px;color:#B9D6BC\" sc-camel-on-click=\"{{ logout }}\">Log out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;padding:28px 32px;overflow-x:hidden;{{ mainThemeVars }}\">\n\n      <sc-if value=\"{{ isFieldPage }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:480px;--accent:#8A3FB8;--accent-hover:#722F9A;--accent-press:#5C2680;--accent-tint:rgba(138,63,184,.12);--gradient-cosmic:linear-gradient(120deg,#8A3FB8 0%,#722F9A 55%,#5C2680 100%);--bg-soft:#F6EEFB;--hairline:#E4CDF2;--hairline-soft:#F0DFF8\">\n          <sc-if value=\"{{ isFieldHome }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"animation:fadeUp .3s ease\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\">\n                <div style=\"flex:1\">\n                  <h2 style=\"font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 2px\">{{ t.greeting }}, {{ currentRep.firstName }}<\u002Fh2>\n                  <p style=\"margin:0;font-size:13px;color:var(--ink-3)\">{{ currentRep.area }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:2px;background:var(--bg-soft);padding:3px;border-radius:var(--r-pill)\">\n                  <sc-for list=\"{{ langOptions }}\" as=\"lo\" hint-placeholder-count=\"2\">\n                    <button style=\"border:none;padding:6px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:600;cursor:pointer;background:{{ lo.bg }};color:{{ lo.color }}\" sc-camel-on-click=\"{{ lo.onSelect }}\">{{ lo.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px\">\n                <div class=\"card\" style=\"padding:16px\">\n                  <div class=\"eyebrow\" style=\"font-size:11px;margin-bottom:6px\">{{ t.visits }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--ink-1)\">{{ currentRep.visitsToday }}<span style=\"font-size:14px;color:var(--ink-3)\">/{{ currentRep.target }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:6px;background:var(--hairline-soft);border-radius:var(--r-pill);margin-top:8px\"><div style=\"height:100%;width:{{ currentRep.visitPct }}%;background:var(--accent);border-radius:var(--r-pill)\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"card\" style=\"padding:16px\">\n                  <div class=\"eyebrow\" style=\"font-size:11px;margin-bottom:6px\">{{ t.newCounters }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--ink-1)\">{{ currentRep.newCounters }}<span style=\"font-size:14px;color:var(--ink-3)\">/{{ currentRep.newCounterTarget }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:6px;background:var(--hairline-soft);border-radius:var(--r-pill);margin-top:8px\"><div style=\"height:100%;width:{{ currentRep.newCounterPct }}%;background:var(--accent);border-radius:var(--r-pill)\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-bottom:22px\">\n                <label style=\"font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px\">Find a counter by mobile number<\u002Flabel>\n                <div style=\"display:flex;gap:8px\">\n                  <input class=\"inp\" type=\"tel\" placeholder=\"10-digit mobile\" maxlength=\"10\" style=\"flex:1\" value=\"{{ counterSearchMobile }}\" sc-camel-on-change=\"{{ setCounterSearchMobile }}\" sc-camel-on-key-down=\"{{ counterSearchKeyDown }}\">\n                  <button class=\"btn btn-primary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ searchCounter }}\">Search<\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"font-size:11px;color:var(--ink-3);margin:6px 0 0\">Found: checks you straight in. Not found: takes you to add it as a new counter.<\u002Fp>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px\">\n                <h4 style=\"font-family:var(--font-display);font-weight:600;font-size:18px;margin:0\">{{ t.beat }}<\u002Fh4>\n                <span style=\"font-size:12px;color:var(--ink-3)\">{{ beatList.length }} remaining<\u002Fspan>\n              <\u002Fdiv>\n\n              <sc-for list=\"{{ beatList }}\" as=\"stop\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline-soft)\">\n                  <div style=\"width:38px;height:38px;background:var(--bg-soft);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:none\">\n                    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-1)\">{{ stop.name }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--ink-3)\">{{ stop.type }} · {{ stop.area }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{ stop.checkIn }}\">{{ t.checkIn }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isFieldForm }}\">\n            <div style=\"animation:fadeUp .3s ease\">\n              <div style=\"display:inline-flex;gap:6px;align-items:center;padding:5px 14px;border-radius:var(--r-pill);background:rgba(30,158,90,.1);color:var(--success);font-size:12px;font-weight:600;margin-bottom:14px\">\n                <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"var(--success)\"><circle cx=\"12\" cy=\"12\" r=\"10\" style=\"animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fcircle><\u002Fsvg>\n                Location verified · checked in\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:var(--r-lg);background:var(--bg-soft);margin-bottom:18px\">\n                <div>\n                  <h3 style=\"font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 2px\">{{ activeCounter.name }}<\u002Fh3>\n                  <p style=\"margin:0;font-size:12px;color:var(--ink-3)\">{{ activeCounter.type }} · {{ activeCounter.area }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <div style=\"font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.02em;color:var(--ink-1)\">{{ elapsedLabel }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:var(--ink-3)\">time on counter<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 18px;font-size:12px;color:var(--ink-3)\">{{ t.formHint }}<\u002Fp>\n              <div style=\"height:1px;background:var(--hairline);margin:0 0 14px\"><\u002Fdiv>\n              <h6 style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px\">Packets sold &amp; stock at counter<\u002Fh6>\n              <sc-for list=\"{{ skuRows }}\" as=\"sku\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline-soft)\">\n                  <div style=\"flex:1;font-size:13px;color:var(--ink-1)\">{{ sku.name }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-size:11px;color:var(--ink-3)\">Sold<\u002Fspan>\n                    <button class=\"btn btn-secondary\" style=\"width:28px;height:28px;padding:0;justify-content:center;border-radius:50%\" sc-camel-on-click=\"{{ sku.dec }}\">−<\u002Fbutton>\n                    <div style=\"width:24px;text-align:center;font-weight:700;font-family:var(--font-display)\">{{ sku.qty }}<\u002Fdiv>\n                    <button class=\"btn btn-secondary\" style=\"width:28px;height:28px;padding:0;justify-content:center;border-radius:50%\" sc-camel-on-click=\"{{ sku.inc }}\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px\">\n                    <span style=\"font-size:11px;color:var(--ink-3)\">Stock<\u002Fspan>\n                    <input class=\"inp\" type=\"number\" min=\"0\" style=\"width:56px;padding:6px 8px;text-align:center\" value=\"{{ sku.stock }}\" sc-camel-on-change=\"{{ sku.setStock }}\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"height:1px;background:var(--hairline);margin:14px 0\"><\u002Fdiv>\n              <div class=\"field\" style=\"margin-bottom:16px\">\n                <label>Our rank at this counter<\u002Flabel>\n                <div style=\"display:flex;gap:2px;background:var(--bg-soft);padding:3px;border-radius:var(--r-pill)\">\n                  <sc-for list=\"{{ rankOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                    <button style=\"flex:1;border:none;padding:8px 4px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;background:{{ opt.bg }};color:{{ opt.color }}\" sc-camel-on-click=\"{{ opt.onSelect }}\">{{ opt.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"field\" style=\"margin-bottom:16px\">\n                <label>Competitor presence<\u002Flabel>\n                <div style=\"display:flex;gap:2px;background:var(--bg-soft);padding:3px;border-radius:var(--r-pill)\">\n                  <sc-for list=\"{{ competitorOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                    <button style=\"flex:1;border:none;padding:8px 4px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;background:{{ opt.bg }};color:{{ opt.color }}\" sc-camel-on-click=\"{{ opt.onSelect }}\">{{ opt.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"field\" style=\"margin-bottom:22px\">\n                <label>Remarks (optional)<\u002Flabel>\n                <input class=\"inp\" type=\"text\" placeholder=\"e.g. asked for bigger visi-cooler\" value=\"{{ visitDraft.remarks }}\" sc-camel-on-change=\"{{ setRemarks }}\">\n              <\u002Fdiv>\n              <button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;padding:16px;font-size:16px\" sc-camel-on-click=\"{{ submitVisit }}\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath>
